name: Build Time List APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Android project
        run: |
          cat \
            source/v12full/chunk_00 \
            source/v12full/chunk_01 \
            source/v12full/chunk_02 \
            source/v12full/chunk_03 \
            source/v12full/chunk_04 \
            source/v12full/chunk_05 \
            source/v12full/chunk_06 \
            source/v12full/chunk_08 \
            source/v12full/part_08 \
            source/v12full/part_09 \
            source/v12full/part_10 \
            source/v12full/part_11 \
            source/v12full/part_12 \
            source/v12full/part_13 \
            source/v12full/part_14 \
            | tr -d '[:space:]' | base64 -d > /tmp/time-list-v12-source.zip
          echo "0657fe74c32c905359fd561bdcae49a1dafec51ad370b9b17bda23d7a22646c4  /tmp/time-list-v12-source.zip" | sha256sum -c -
          rm -rf /tmp/time-list
          mkdir -p /tmp/time-list
          unzip -q /tmp/time-list-v12-source.zip -d /tmp/time-list
          cat source/v13patch/chunk_00 source/v13patch/chunk_01 source/v13patch/chunk_02 source/v13patch/chunk_03 > /tmp/time-list-v13.patch
          cat source/v14patch/chunk_00 source/v14patch/chunk_01 source/v14patch/chunk_02 source/v14patch/chunk_03 > /tmp/time-list-v14.patch
          cat source/v15patch/chunk_00 source/v15patch/chunk_01 source/v15patch/chunk_02 > /tmp/time-list-v15.patch
          echo "218794dd0d972fef513d5d0cff541393e4c2a1c711a8916a485168f3a038ae4c  /tmp/time-list-v15.patch" | sha256sum -c -
          cd /tmp/time-list/time-list-android
          git apply --check /tmp/time-list-v13.patch
          git apply /tmp/time-list-v13.patch
          git apply --check /tmp/time-list-v14.patch
          git apply /tmp/time-list-v14.patch
          sed -i 's/versionCode 4/versionCode 5/' app/build.gradle
          git apply --check /tmp/time-list-v15.patch
          git apply /tmp/time-list-v15.patch
          for p in "$GITHUB_WORKSPACE"/source/v16safe/part0.patch "$GITHUB_WORKSPACE"/source/v16safe/part1.patch "$GITHUB_WORKSPACE"/source/v16safe/part2.patch "$GITHUB_WORKSPACE"/source/v16safe/part3.patch; do
            git apply --check "$p"
            git apply "$p"
          done
          cp "$GITHUB_WORKSPACE/source/v16safe/NavIconView.java" app/src/main/java/com/timelist/app/NavIconView.java
          cp "$GITHUB_WORKSPACE/source/v16safe/HeaderIconView.java" app/src/main/java/com/timelist/app/HeaderIconView.java
          git apply --check "$GITHUB_WORKSPACE/source/v17patch/v1.7.patch"
          git apply "$GITHUB_WORKSPACE/source/v17patch/v1.7.patch"
          git apply --check "$GITHUB_WORKSPACE/source/v18patch/v1.8.patch"
          git apply "$GITHUB_WORKSPACE/source/v18patch/v1.8.patch"
          test -f app/src/main/java/com/timelist/app/NavIconView.java
          test -f app/src/main/java/com/timelist/app/HeaderIconView.java
          grep -q "versionCode 9" app/build.gradle
          grep -q "versionName '1.8.0'" app/build.gradle

      - name: Build debug APK
        working-directory: /tmp/time-list/time-list-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare installable APK
        run: |
          cp /tmp/time-list/time-list-android/app/build/outputs/apk/debug/app-debug.apk Time-List-v1.8.apk
          ls -lh Time-List-v1.8.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Time-List-v1.8-APK
          path: Time-List-v1.8.apk
          if-no-files-found: error
          retention-days: 30
