name: Build time.List APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Android project
        run: |
          cat source/chunks/chunk_* | base64 -d > /tmp/time-list-source.zip
          unzip -q /tmp/time-list-source.zip -d /tmp/time-list
          test -f /tmp/time-list/time-list-android/app/build.gradle
          echo 'android.useAndroidX=true' >> /tmp/time-list/time-list-android/gradle.properties
          echo 'android.enableJetifier=true' >> /tmp/time-list/time-list-android/gradle.properties

      - name: Build debug APK
        working-directory: /tmp/time-list/time-list-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare installable APK
        run: |
          cp /tmp/time-list/time-list-android/app/build/outputs/apk/debug/app-debug.apk time.List-v1.0.apk
          ls -lh time.List-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: time.List-v1.0-APK
          path: time.List-v1.0.apk
          if-no-files-found: error
          retention-days: 30
