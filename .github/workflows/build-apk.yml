name: Build Time List APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Android project
        run: |
          cat source/v11/chunk_* | tr -d '[:space:]' | base64 -d > /tmp/time-list-source.zip
          rm -rf /tmp/time-list
          mkdir -p /tmp/time-list
          unzip -q /tmp/time-list-source.zip -d /tmp/time-list
          test -f /tmp/time-list/time-list-android/app/build.gradle

      - name: Build debug APK
        working-directory: /tmp/time-list/time-list-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare installable APK
        run: |
          cp /tmp/time-list/time-list-android/app/build/outputs/apk/debug/app-debug.apk Time-List-v1.1.apk
          ls -lh Time-List-v1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Time-List-v1.1-APK
          path: Time-List-v1.1.apk
          if-no-files-found: error
          retention-days: 30
